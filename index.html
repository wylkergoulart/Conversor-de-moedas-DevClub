<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Conversor de Moedas</title>
</head>

<body>

    <img class="logo" src="./assets/logo.gif" alt="logoSite">

    <div class="container">
 
        <label>
            Converter <b>de:</b>
            <select>
                <option value="USD">US$ Dólar Americano</option>
                <option value="EUR">€ Euro</option>
                <option value="GBP">£ Libra Esterlina</option>
                <option value="BTC">₿ Bitcoin</option>
                <option value="BRL">R$ Real Brasileiro</option>

            </select>
        </label>

          <label><br>
            Converter <b>para:</b>
            <select>
                <option value="USD">US$ Dólar Americano</option>
                <option value="EUR">€ Euro</option>
                <option value="GBP">£ Libra Esterlina</option>
                <option value="BTC">₿ Bitcoin</option>
                <option value="BRL">R$ Real Brasileiro</option>
            </select>
        </label>

        <label> 
            <b>Valor:</b>
            <input class="input-currency-value" type="number" placeholder="Digite o valor a ser convertido">
        </label>

        <button class="convert-button">Converter</button>
    
    <div class="coin-container">
        <div class="imagem-a-ser-convertida">
            <img src="./assets/brasil 2.png" alt="Imagem a ser convertida">
            <p>Real</p>
            <P>R$ 0,00</P>
        </div>

        <img class="seta" src="./assets/Vector.png" alt="seta">

        <div class="imagem-convertida">
            <img src="./assets/usa.png" alt="Imagem convertida">
            <p>Dólar</p>
            <p>US$ 0,00</p>
        </div>
    </div>
</div>


</body>
 <script src="./script.js"></script>
</html>
