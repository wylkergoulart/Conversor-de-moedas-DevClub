<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Conversor de Moedas</title>
</head>

<body>

    <img class="logo" src="./assets/logo.gif" alt="logoSite">

    <div class="container">
 
        <label>
            Converter <b>de:</b>
            <select class="currency-select-to-be-converted">
                <option value="BRL">R$ Real Brasileiro</option>
                <option value="USD">US$ Dólar Americano</option>
                <option value="GBP">£ Libra Esterlina</option>
                <option value="EUR">€ Euro</option>
                <option value="BTC">₿ Bitcoin</option>
              

            </select>
        </label>

          <label><br>
            Converter <b>para:</b>
            <select class="currency-select">
                <option value="USD">US$ Dólar Americano</option>
                <option value="BRL">R$ Real Brasileiro</option>
                <option value="GBP">£ Libra Esterlina</option>
                <option value="EUR">€ Euro</option>
                <option value="BTC">₿ Bitcoin</option>
              
            </select>
        </label>

        <label> 
            <b>Valor:</b>
            <input class="input-currency-value" type="number" placeholder="Digite o valor a ser convertido">
        </label>

        <button class="convert-button">Converter</button>
    
    <div class="currency-container">
        <div class="moeda-a-ser-convertida">
            <img class="currency-image-origin" src="./assets/brasil 2.png" alt="Imagem-a-ser-convertida">
            <p class="currency-name-origin">Real</p>
            <P id="valor-origem">R$ 0,00</P>
        </div>

        <img class="seta" src="./assets/Vector.png" alt="seta">

        <div class="moeda-convertida">
            <img class="currency-image" src="./assets/usa.png" alt="Imagem convertida">
            <p class="currency-name">Dólar</p>
            <p id="valor-destino">US$ 0,00</p>
        </div>
    </div>
</div>


</body>
 <script src="./script.js"></script>
</html>
